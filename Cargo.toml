[package]
name = "twitch_surf"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "surf"
documentation = "https://docs.rs/twitch_surf"
repository = "https://github.com/m3idnotfree/twitch_surf"
license = "MIT OR Apache-2.0"
keywords = ["twitch"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1.0.229", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[features]
serde = ["dep:serde"]
